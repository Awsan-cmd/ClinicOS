services:
  postgres:
    image: postgres:17-alpine
    container_name: clinicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicos}
      POSTGRES_USER: ${POSTGRES_USER:-clinicos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicos_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clinicos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicos} -d ${POSTGRES_DB:-clinicos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinicos-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - clinicos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinicos_postgres_data:
  clinicos_redis_data:
